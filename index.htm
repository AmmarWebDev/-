<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مواقيت الصلاة</title>
  <!-- linking our style.css -->
  <link rel="stylesheet" href="assets/css/style.min.css" />
</head>
<body>
  <main class="container">
    <header>
      <div class="info">
        <h1 class="city"></h1>
        <h3 class="date"></h3>
      </div>
      <img
        src="assets/images/sticker-1.jpg"
        alt="صلي على الحبيب"
        loading="lazy"
      />
      <div class="options">
        <select id="city" name="city">
          <option value="Cairo">القاهرة</option>
          <option value="Alexandria">الاسكندرية</option>
          <option value="Mecca">مكة</option>
          <option value="Riyadh">الرياض</option>
        </select>
        <input type="date" name="day" id="day" />
      </div>
    </header>
    <div class="timings-wrapper">
      <!-- this will be populated with js -->
    </div>
  </main>

  <!-- axios library for fetching APIs -->
  <script src="node_modules/axios/dist/axios.min.js"></script>
  <!-- our main js file -->
  <script src="assets/js/script.js"></script>
</body>
</html>
